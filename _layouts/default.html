<!doctype html>
<html lang="{{ site.lang | default: 'fr-FR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="icon" href="{{ '/assets/artwork-logo.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
  </head>
  <body class="page page--{{ page.page_class | default: 'default' }}">
    <a class="skip-link" href="#contenu">Aller au contenu principal</a>
    <div class="ambient ambient--one" aria-hidden="true"></div>
    <div class="ambient ambient--two" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Hermes — Accueil">
        <img src="{{ '/assets/artwork-logo.svg' | relative_url }}" alt="">
        <span><strong>Hermes</strong></span>
      </a>
      <nav class="site-nav" aria-label="Navigation principale">
        <a href="{{ '/' | relative_url }}" {% if page.page_class == 'home' %}aria-current="page"{% endif %}>Accueil</a>
        <a href="{{ '/privacy.html' | relative_url }}" {% if page.page_class == 'privacy' %}aria-current="page"{% endif %}>Confidentialité</a>
      </nav>
    </header>

    <main id="contenu" class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <a class="brand brand--footer" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/artwork-logo.svg' | relative_url }}" alt="">
        <span>Hermes</span>
      </a>
      <p>Outil privé · Données sous contrôle</p>
      <p>© 2026</p>
    </footer>
  </body>
</html>
